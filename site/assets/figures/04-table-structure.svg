<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 445" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">财务与政策表格提取必须保留列头</title><desc id="svg-desc">对比只拼接单元格的错误表示与保持表头、值、单位的结构化记录。</desc><defs><marker id="ar-147f80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#147f80"/></marker><marker id="ar-d06d4d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#d06d4d"/></marker><marker id="ar-7461ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7461ba"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:22px;font-weight:760}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:#4c686c}.tiny{font-size:14px;fill:#4c686c}.accent{font-size:14px;font-weight:720;fill:#147f80}.warning{font-size:14px;font-weight:680;fill:#ac583a}.white{fill:white;font-size:15px;font-weight:700}.num{font-size:19px;font-weight:750;fill:#20494a}</style><rect x="0" y="0" width="1080" height="445" rx="22" fill="#f7faf8"/><text x="36" y="48" class="title" >单元格值必须绑定表头 / 行键 / 单位</text><text x="36" y="91" class="accent" >原始表格示例</text><rect x="36" y="105" width="545" height="248" fill="#fff" stroke="#bcd6d0" stroke-width="1.5" rx="12"/><rect x="52" y="127" width="170" height="65" fill="#dbeee9" stroke="none" stroke-width="1.5" rx="0"/><rect x="222" y="127" width="170" height="65" fill="#dbeee9" stroke="none" stroke-width="1.5" rx="0"/><rect x="392" y="127" width="170" height="65" fill="#dbeee9" stroke="none" stroke-width="1.5" rx="0"/><rect x="52" y="192" width="170" height="65" fill="#fff" stroke="none" stroke-width="1.5" rx="0"/><rect x="222" y="192" width="170" height="65" fill="#fff" stroke="none" stroke-width="1.5" rx="0"/><rect x="392" y="192" width="170" height="65" fill="#fff" stroke="none" stroke-width="1.5" rx="0"/><rect x="52" y="257" width="170" height="65" fill="#fff" stroke="none" stroke-width="1.5" rx="0"/><rect x="222" y="257" width="170" height="65" fill="#fff" stroke="none" stroke-width="1.5" rx="0"/><rect x="392" y="257" width="170" height="65" fill="#fff" stroke="none" stroke-width="1.5" rx="0"/><text x="67" y="165" class="label" >项目</text><text x="237" y="165" class="label" >2025年</text><text x="407" y="165" class="label" >2026年</text><text x="67" y="230" class="small" >收入</text><text x="237" y="230" class="small" >8 万元</text><text x="407" y="230" class="small" >9 万元</text><text x="67" y="295" class="small" >利润</text><text x="237" y="295" class="small" >3 万元</text><text x="407" y="295" class="small" >4 万元</text><path d="M590,176 L626,176" fill="none" stroke="#d06d4d" stroke-width="2.6"  marker-end="url(#ar-d06d4d)"/><rect x="638" y="113" width="404" height="116" fill="#fff1e8" stroke="#dfa18a" stroke-width="1.5" rx="13"/><text x="654" y="144" class="label" >错误：收入 8 9；利润 3 4</text><text x="654" y="169" class="small" >缺年份、缺单位，无法精确引用</text><path d="M590,312 L626,312" fill="none" stroke="#147f80" stroke-width="2.6"  marker-end="url(#ar-147f80)"/><rect x="638" y="259" width="404" height="116" fill="#e9f5f2" stroke="#7bb9ad" stroke-width="1.5" rx="13"/><text x="654" y="290" class="label" >正确：收入 | 2026年 | 9万元</text><text x="654" y="315" class="small" >记录 row / column / unit / page / source</text><text x="40" y="411" class="small" >表格重建的目标是关系与来源可核验，而不只是 OCR 输出单词。</text></svg>