<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title description"><title id="title">注意力与外部证据不是同一件事</title><desc id="description">自注意力整合上下文 token 信息，却不提供事实真值证明。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#568a87"/></marker></defs><rect width="960" height="360" rx="20" fill="#f7faf8"/><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#203035}.small{font-size:15px;fill:#556c70}.title{font-size:22px;font-weight:750}.label{font-size:18px;font-weight:680}.note{font-size:14px;fill:#556c70}</style><text x="38" y="51" class="title">注意力组织上下文，不等于事实核查</text><rect x="36" y="113" width="226" height="93" rx="13" fill="#e4f3f0" stroke="#70aaa7" stroke-width="2"/><text x="149" y="147" text-anchor="middle" class="label">问题 tokens</text><text x="149" y="174" text-anchor="middle" class="small">“保修多久？”</text><rect x="360" y="113" width="226" height="93" rx="13" fill="#ede9f7" stroke="#aa9adb" stroke-width="2"/><text x="473" y="147" text-anchor="middle" class="label">检索片段 tokens</text><text x="473" y="174" text-anchor="middle" class="small">“2026版保修两年”</text><rect x="684" y="113" width="226" height="93" rx="13" fill="#f9e9e2" stroke="#d98c73" stroke-width="2"/><text x="797" y="147" text-anchor="middle" class="label">输出 tokens</text><text x="797" y="174" text-anchor="middle" class="small">“两年 [S1]”</text><path d="M263 158 L355 158" stroke="#568a87" fill="none" stroke-width="3" marker-end="url(#arrow)"/><path d="M586 158 L679 158" stroke="#568a87" fill="none" stroke-width="3" marker-end="url(#arrow)"/><text x="38" y="279" class="small">模型依据注意力综合输入；引用 [S1] 是否真的支持“两年”，必须另行校验。</text></svg>