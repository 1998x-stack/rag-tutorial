<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title description"><title id="title">逐级定位 RAG 错误</title><desc id="description">按检索命中、证据支持和生成引用三个层次检查问题。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#568a87"/></marker></defs><rect width="960" height="360" rx="20" fill="#f7faf8"/><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#203035}.small{font-size:15px;fill:#556c70}.title{font-size:22px;font-weight:750}.label{font-size:18px;font-weight:680}.note{font-size:14px;fill:#556c70}</style><text x="35" y="48" class="title">先找证据缺口，再找生成偏差</text><rect x="38" y="112" width="256" height="111" rx="13" fill="#e4f3f0" stroke="#70aaa7" stroke-width="2"/><text x="166" y="146" text-anchor="middle" class="label">检索质量</text><text x="166" y="173" text-anchor="middle" class="small">Relevant@k / Recall@k</text><rect x="353" y="112" width="256" height="111" rx="13" fill="#e4f3f0" stroke="#70aaa7" stroke-width="2"/><text x="481" y="146" text-anchor="middle" class="label">证据充分性</text><text x="481" y="173" text-anchor="middle" class="small">是否包含所需事实</text><rect x="670" y="112" width="256" height="111" rx="13" fill="#e4f3f0" stroke="#70aaa7" stroke-width="2"/><text x="798" y="146" text-anchor="middle" class="label">答案忠实性</text><text x="798" y="173" text-anchor="middle" class="small">每个事实是否被引用支持</text><path d="M295 168 L348 168" stroke="#568a87" fill="none" stroke-width="3" marker-end="url(#arrow)"/><path d="M610 168 L665 168" stroke="#568a87" fill="none" stroke-width="3" marker-end="url(#arrow)"/><text x="38" y="287" class="small">示例诊断维度，并非一种统一的自动评分公式。</text></svg>