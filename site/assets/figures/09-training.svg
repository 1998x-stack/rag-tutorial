<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" role="img" aria-labelledby="t-09-train d-09-train"><title id="t-09-train">对比学习把正例拉近、负例推远</title><desc id="d-09-train">在向量空间中，训练目标让查询向量与其正例文档靠近，同时把批内的负例文档推远。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.k{font-size:22px;font-weight:760}.l{font-size:16px;font-weight:700}.s{font-size:14px;fill:#4c686c}.a{font-size:14px;font-weight:720;fill:#147f80}</style><rect x="0" y="0" width="1080" height="380" rx="22" fill="#f7faf8"/><text x="38" y="46" class="k">内积越大越相关：拉近正例，推开负例</text><circle cx="430" cy="210" r="16" fill="#d06d4d"/><text x="404" y="252" class="l">查询 q</text><circle cx="560" cy="150" r="13" fill="#147f80"/><text x="580" y="146" class="a">正例 p+</text><circle cx="250" cy="130" r="12" fill="#8ba7a3"/><text x="170" y="120" class="s">负例</text><circle cx="300" cy="300" r="12" fill="#8ba7a3"/><text x="222" y="330" class="s">负例</text><line x1="430" y1="210" x2="560" y2="150" stroke="#147f80" stroke-width="2.2" marker-end="url(#ar9001)"/><line x1="430" y1="210" x2="250" y2="130" stroke="#8ba7a3" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#ar9002)"/><line x1="430" y1="210" x2="300" y2="300" stroke="#8ba7a3" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#ar9002)"/><text x="500" y="200" class="a">拉近</text><text x="300" y="180" class="s">推远</text><defs><marker id="ar9001" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#147f80"/></marker><marker id="ar9002" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#8ba7a3"/></marker></defs><text x="38" y="360" class="s">批内其它正例文档充当当前查询的负例，无需额外挖掘</text></svg>
