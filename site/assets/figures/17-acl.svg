<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" role="img" aria-labelledby="t17acl d17acl">
<title id="t17acl">同一文档不同分块对不同角色的可见性矩阵</title>
<desc id="d17acl">一份文档被分成 public、internal、confidential 三个分块；外部访客只能看到 public 分块，内部员工可看到 public 与 internal，管理员可看到全部三个。文档级控制下任一分块机密会导致整篇不可见，分块级控制则按分块标注。</desc>
<style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.k{font-size:22px;font-weight:760}.l{font-size:14px;font-weight:700}.s{font-size:13px;fill:#4c686c}.y{font-size:13px;font-weight:720;fill:#147f80}.n{font-size:13px;font-weight:700;fill:#94a7a7}</style>
<rect x="0" y="0" width="1080" height="420" rx="22" fill="#f7faf8"/>
<text x="38" y="44" class="k">同一篇文档，不同分块、不同可见范围</text>
<rect x="40" y="120" width="360" height="60" rx="9" fill="#eef5f3"/>
<text x="58" y="156" class="s">角色 \ 分块</text>
<rect x="440" y="120" width="190" height="60" rx="9" fill="#eef7f5" stroke="#147f80" stroke-width="1.4"/>
<text x="470" y="150" class="l">分块1</text><text x="470" y="170" class="s">public</text>
<rect x="650" y="120" width="190" height="60" rx="9" fill="#fff1e8" stroke="#d06d4d" stroke-width="1.4"/>
<text x="680" y="150" class="l">分块2</text><text x="680" y="170" class="s">internal</text>
<rect x="860" y="120" width="180" height="60" rx="9" fill="#ede9f7" stroke="#7461ba" stroke-width="1.4"/>
<text x="890" y="150" class="l">分块3</text><text x="890" y="170" class="s">confidential</text>
<rect x="40" y="192" width="360" height="60" rx="9" fill="#fff" stroke="#e5eeea"/><text x="58" y="228" class="l">外部访客（public）</text>
<rect x="440" y="192" width="190" height="60" rx="9" fill="#fff" stroke="#e5eeea"/><text x="510" y="228" class="y">✔ 可见</text>
<rect x="650" y="192" width="190" height="60" rx="9" fill="#fff" stroke="#e5eeea"/><text x="715" y="228" class="n">✖ 不可见</text>
<rect x="860" y="192" width="180" height="60" rx="9" fill="#fff" stroke="#e5eeea"/><text x="925" y="228" class="n">✖ 不可见</text>
<rect x="40" y="262" width="360" height="60" rx="9" fill="#fff" stroke="#e5eeea"/><text x="58" y="298" class="l">内部员工（internal）</text>
<rect x="440" y="262" width="190" height="60" rx="9" fill="#fff" stroke="#e5eeea"/><text x="510" y="298" class="y">✔ 可见</text>
<rect x="650" y="262" width="190" height="60" rx="9" fill="#fff" stroke="#e5eeea"/><text x="715" y="298" class="y">✔ 可见</text>
<rect x="860" y="262" width="180" height="60" rx="9" fill="#fff" stroke="#e5eeea"/><text x="925" y="298" class="n">✖ 不可见</text>
<rect x="40" y="332" width="360" height="60" rx="9" fill="#fff" stroke="#e5eeea"/><text x="58" y="368" class="l">管理员（confidential+）</text>
<rect x="440" y="332" width="190" height="60" rx="9" fill="#fff" stroke="#e5eeea"/><text x="510" y="368" class="y">✔ 可见</text>
<rect x="650" y="332" width="190" height="60" rx="9" fill="#fff" stroke="#e5eeea"/><text x="715" y="368" class="y">✔ 可见</text>
<rect x="860" y="332" width="180" height="60" rx="9" fill="#fff" stroke="#e5eeea"/><text x="925" y="368" class="y">✔ 可见</text>
</svg>
