<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" role="img" aria-labelledby="t11stage d11stage">
<title id="t11stage">两阶段检索：先粗排召回 Top-N，再用交叉编码器精排 Top-K</title>
<desc id="t11stage">全量文档库先经第一阶段的双编码器或混合检索粗排，召回 N 个候选；第二阶段用交叉编码器对每个候选精细打分，重排后取 K 个送入生成。N 远大于 K。</desc>
<style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.k{font-size:22px;font-weight:760}.l{font-size:16px;font-weight:700}.s{font-size:14px;fill:#4c686c}.a{font-size:14px;font-weight:720;fill:#147f80}.o{fill:#d06d4d}</style>
<rect x="0" y="0" width="1080" height="360" rx="22" fill="#f7faf8"/>
<text x="38" y="46" class="k">广撒网 → 精挑细选：N 个候选只做一次重排</text>
<rect x="36" y="150" width="170" height="70" rx="11" fill="#e2f1ee" stroke="#7db6a9"/>
<text x="54" y="182" class="l">全量文档库</text>
<text x="54" y="204" class="s">百万级</text>
<rect x="270" y="150" width="220" height="70" rx="11" fill="#eef7f5" stroke="#147f80" stroke-width="2"/>
<text x="288" y="182" class="l">第一阶段 粗排</text>
<text x="288" y="204" class="s">双编码器 / 混合检索</text>
<rect x="548" y="150" width="230" height="70" rx="11" fill="#fff1e8" stroke="#d06d4d" stroke-width="2"/>
<text x="566" y="182" class="l o">第二阶段 精排</text>
<text x="566" y="204" class="s">交叉编码器逐对打分</text>
<rect x="836" y="150" width="200" height="70" rx="11" fill="#ede9f7" stroke="#7461ba"/>
<text x="854" y="182" class="l">送入生成</text>
<text x="854" y="204" class="s">Top-K 上下文</text>
<path d="M206 185 L270 185" fill="none" stroke="#8ba7a3" stroke-width="2" marker-end="url(#a11s)"/>
<path d="M490 185 L548 185" fill="none" stroke="#8ba7a3" stroke-width="2" marker-end="url(#a11s)"/>
<path d="M778 185 L836 185" fill="none" stroke="#8ba7a3" stroke-width="2" marker-end="url(#a11s)"/>
<text x="270" y="108" class="a">召回 Top-N（例：N=100）</text>
<text x="548" y="108" class="o">重排取 Top-K（例：K=5）</text>
<text x="38" y="286" class="s">第一阶段追求召回（不漏），第二阶段追求精度（排在最前的是真正能回答的文档）。</text>
<text x="38" y="316" class="s">N=100、K=5 为常见工程经验区间，不是最优值；N 越大召回越高但重排延迟越大。</text>
<defs><marker id="a11s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#8ba7a3"/></marker></defs>
</svg>
