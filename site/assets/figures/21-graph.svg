<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" role="img" aria-labelledby="t21g d21g">
<title id="t21g">计划-执行-评估的状态图：分析、检索、评估、生成，评估结果决定回到检索还是继续生成</title>
<desc id="d21g">状态从分析问题开始，进入检索；检索后进入评估节点。评估若判定信息不足，则沿条件边回到检索再查一次；若足够，则进入生成节点输出答案。用显式状态机表达控制流，比一次性提示更可检查。</desc>
<style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.k{font-size:22px;font-weight:760}.l{font-size:14px;font-weight:720}.s{font-size:12px;fill:#4c686c}.e{font-size:12px;fill:#7461ba;font-weight:700}</style>
<rect x="0" y="0" width="1080" height="380" rx="22" fill="#f7faf8"/>
<text x="38" y="46" class="k">把控制流写成一个可检查的状态图</text>
<rect x="60" y="160" width="180" height="72" rx="12" fill="#ede9f7" stroke="#7461ba" stroke-width="2"/><text x="82" y="202" class="l">分析问题</text>
<rect x="330" y="160" width="180" height="72" rx="12" fill="#eef7f5" stroke="#147f80" stroke-width="2"/><text x="352" y="202" class="l">检索</text>
<rect x="600" y="160" width="180" height="72" rx="12" fill="#eef7f5" stroke="#147f80" stroke-width="2"/><text x="622" y="202" class="l">评估</text>
<rect x="860" y="160" width="180" height="72" rx="12" fill="#fff1e8" stroke="#d06d4d" stroke-width="2"/><text x="882" y="202" class="l">生成答案</text>
<path d="M240 196 H326" stroke="#7f9a97" stroke-width="3" marker-end="url(#a21g)"/>
<path d="M510 196 H596" stroke="#7f9a97" stroke-width="3" marker-end="url(#a21g)"/>
<path d="M780 196 H856" stroke="#7f9a97" stroke-width="3" marker-end="url(#a21g)"/>
<text x="640" y="150" class="e">足够</text>
<path d="M690 232 C690 330 420 330 420 236" fill="none" stroke="#7461ba" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a21g)"/>
<text x="500" y="352" class="e">不足 → 回到检索（带步数上限）</text>
<text x="60" y="90" class="s">每个节点是一个函数：读状态、写状态。边决定下一步去哪个节点。</text>
<text x="60" y="112" class="s">状态里保存子问题、检索结果与步数；上限一到就强制走“生成”出口，避免死循环。</text>
<defs><marker id="a21g" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#7f9a97"/></marker></defs>
</svg>
