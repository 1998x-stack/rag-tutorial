<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" role="img" aria-labelledby="t10rrf d10rrf">
<title id="t10rrf">RRF 按名次倒数求和，把两个列表融合成一个</title>
<desc id="d10rrf">BM25 列表顺序为 doc_A、doc_B、doc_C，稠密列表顺序为 doc_B、doc_D、doc_A；对每个文档累加 1/(60+名次)：doc_B 在向量路第一、BM25 路第二，融合分最高，doc_A 次之，doc_D、doc_C 随后。</desc>
<style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.k{font-size:22px;font-weight:760}.l{font-size:16px;font-weight:700}.s{font-size:15px;fill:#4c686c}.a{font-size:15px;font-weight:720;fill:#147f80}.o{font-size:15px;font-weight:720;fill:#d06d4d}</style>
<rect x="0" y="0" width="1080" height="400" rx="22" fill="#f7faf8"/>
<text x="38" y="46" class="k">RRF：每个文档把各路的名次倒数加起来</text>
<text x="70" y="92" class="l">BM25 名次</text>
<text x="420" y="92" class="l">向量名次</text>
<text x="770" y="92" class="l">融合分（k=60）</text>
<rect x="60" y="108" width="250" height="50" rx="9" fill="#eef7f5" stroke="#a9cfc6"/><text x="78" y="139" class="s">1 · doc_A</text>
<rect x="60" y="164" width="250" height="50" rx="9" fill="#eef7f5" stroke="#a9cfc6"/><text x="78" y="195" class="s">2 · doc_B</text>
<rect x="60" y="220" width="250" height="50" rx="9" fill="#eef7f5" stroke="#a9cfc6"/><text x="78" y="251" class="s">3 · doc_C</text>
<rect x="410" y="108" width="250" height="50" rx="9" fill="#ede9f7" stroke="#bcb0e4"/><text x="428" y="139" class="s">1 · doc_B</text>
<rect x="410" y="164" width="250" height="50" rx="9" fill="#ede9f7" stroke="#bcb0e4"/><text x="428" y="195" class="s">2 · doc_D</text>
<rect x="410" y="220" width="250" height="50" rx="9" fill="#ede9f7" stroke="#bcb0e4"/><text x="428" y="251" class="s">3 · doc_A</text>
<rect x="760" y="108" width="270" height="50" rx="9" fill="#fff" stroke="#ceddd8"/><text x="778" y="139" class="a">1 · doc_B = 0.0325</text>
<rect x="760" y="164" width="270" height="50" rx="9" fill="#fff" stroke="#ceddd8"/><text x="778" y="195" class="a">2 · doc_A = 0.0323</text>
<rect x="760" y="220" width="270" height="50" rx="9" fill="#fff" stroke="#ceddd8"/><text x="778" y="251" class="o">3 · doc_D = 0.0161</text>
<rect x="760" y="276" width="270" height="50" rx="9" fill="#fff" stroke="#ceddd8"/><text x="778" y="307" class="o">4 · doc_C = 0.0159</text>
<path d="M310 133 L410 133 M310 189 L410 189 M310 245 L410 189" fill="none" stroke="#8ba7a3" stroke-width="1.6"/>
<path d="M660 133 L760 133 M660 189 L760 189 M660 245 L760 245" fill="none" stroke="#8ba7a3" stroke-width="1.6"/>
<text x="38" y="360" class="s">doc_B 名次 2+1 → 0.01613+0.01639=0.0325；doc_A 名次 1+3 → 0.01639+0.01587=0.0323。</text>
<text x="38" y="384" class="s">数值按公式 1/(k+名次) 手算，仅为教学示意，不是任何数据集上的评测结果。</text>
</svg>
