<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 451" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">大小与重叠如何改变滑动窗口</title><desc id="svg-desc">长度 L=20、窗口 s=8、重叠 o=3、步长 t=5；示例窗口范围分别为 0–7、5–12、10–17、15–19。</desc><defs><marker id="ar-147f80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#147f80"/></marker><marker id="ar-d06d4d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#d06d4d"/></marker><marker id="ar-7461ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7461ba"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:22px;font-weight:760}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:#4c686c}.tiny{font-size:14px;fill:#4c686c}.accent{font-size:14px;font-weight:720;fill:#147f80}.warning{font-size:14px;font-weight:680;fill:#ac583a}.white{fill:white;font-size:15px;font-weight:700}.num{font-size:19px;font-weight:750;fill:#20494a}</style><rect x="0" y="0" width="1080" height="451" rx="22" fill="#f7faf8"/><text x="39" y="48" class="title" >s = 8，o = 3，步长 t = s − o = 5</text><text x="42" y="88" class="small" >源文本：位置 0 至 19（20 个字符，非 token）</text><rect x="41" y="120" width="43" height="36" fill="#e6f3f0" stroke="#ccdcd7" stroke-width="1.5" rx="5"/><text x="62" y="143" class="tiny" text-anchor="middle">0</text><rect x="90" y="120" width="43" height="36" fill="#fff" stroke="#ccdcd7" stroke-width="1.5" rx="5"/><text x="111" y="143" class="tiny" text-anchor="middle">1</text><rect x="139" y="120" width="43" height="36" fill="#fff" stroke="#ccdcd7" stroke-width="1.5" rx="5"/><text x="160" y="143" class="tiny" text-anchor="middle">2</text><rect x="188" y="120" width="43" height="36" fill="#fff" stroke="#ccdcd7" stroke-width="1.5" rx="5"