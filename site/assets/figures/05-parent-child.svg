<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 452" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">检索短块，返回长父上下文</title><desc id="svg-desc">两层索引中子块用于定位，父块用于完整上下文输出，保留稳定父子来源映射。 </desc><defs><marker id="ar-147f80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#147f80"/></marker><marker id="ar-d06d4d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#d06d4d"/></marker><marker id="ar-7461ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7461ba"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:22px;font-weight:760}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:#4c686c}.tiny{font-size:14px;fill:#4c686c}.accent{font-size:14px;font-weight:720;fill:#147f80}.warning{font-size:14px;font-weight:680;fill:#ac583a}.white{fill:white;font-size:15px;font-weight:700}.num{font-size:19px;font-weight:750;fill:#20494a}</style><rect x="0" y="0" width="1080" height="452" rx="22" fill="#f7faf8"/><text x="36" y="49" class="title" >先精准命中，再按父节点回填上下文</text><rect x="38" y="107" width="447" height="97" fill="#ede9f7" stroke="#a99bd4" stroke-width="1.5" rx="13"/><text x="54" y="138" class="label" >P1 · 退款政策（父段）</text><text x="54" y="163" class="small" >适用范围、期限、例外、凭证</text><rect x="562" y="107" width="480" height="97" fill="#ede9f7" stroke="#a99bd4" stroke-width="1.5" rx="13"/><text x="578" y="138" class="label" >P2 · 账户安全（父段）</text><text x="578" y="163" class="small" >登录、二次验证、恢复方式</text><rect x="45" y="253" width="130" height="61" fill="#dceee9" stroke="#85bcb0" stroke-width="1.5" rx="7"/><text x="110" y="289.5" class="small" text-anchor="middle">C1: 范围</text><rect x="196" y="253" width="130" height="61" fill="#caebe2" stroke="#3b988e" stroke-width="1.5" rx="7"/><text x="261" y="289.5" class="small" text-anchor="middle">C2: 期限</text><rect x="347" y="253" width="130" height="61" fill="#dceee9" stroke="#85bcb0" stroke-width="1.5" rx="7"/><text x="412" y="289.5" class="small" text-anchor="middle">C3: 凭证</text><rect x="573" y="253" width="147" height="61" fill="#dceee9" stroke="#85bcb0" stroke-width="1.5" rx="7"/><text x="646.5" y="289.5" class="small" text-anchor="middle">C4: 登录</text><rect x="741" y="253" width="147" height="61" fill="#dceee9" stroke="#85bcb0" stroke-width="1.5" rx="7"/><text x="814.5" y="289.5" class="small" text-anchor="middle">C5: 验证</text><path d="M255,205 L255,245" fill="none" stroke="#7461ba" stroke-width="2.6"  marker-end="url(#ar-7461ba)"/><path d="M802,205 L802,245" fill="none" stroke="#7461ba" stroke-width="2.6"  marker-end="url(#ar-7461ba)"/><text x="38" y="367" class="label" >问“退款期限？” → C2 命中 → 取 parent_id=P1 → 返回 P1 完整语义段</text><text x="38" y="411" class="small" >父段也要经过权限与版本过滤；回填越长，输入预算成本越高。</text></svg>