<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title description"><title id="title">召回、重排、上下文预算</title><desc id="description">大量候选先召回，少量高价值证据进入模型。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#568a87"/></marker></defs><rect width="960" height="360" rx="20" fill="#f7faf8"/><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#203035}.small{font-size:15px;fill:#556c70}.title{font-size:22px;font-weight:750}.label{font-size:18px;font-weight:680}.note{font-size:14px;fill:#556c70}</style><text x="34" y="48" class="title">扩大召回 ≠ 把全部候选塞进 Prompt</text><rect x="36" y="102" width="255" height="154" rx="14" fill="#e3f2ef" stroke="#77aaa6"/><text x="57" y="135" class="label">候选集合 (Top-k)</text><rect x="57" y="164" width="30" height="55" rx="5" fill="#80bcb5"/><rect x="96" y="164" width="30" height="55" rx="5" fill="#80bcb5"/><rect x="135" y="164" width="30" height="55" rx="5" fill="#80bcb5"/><rect x="174" y="164" width="30" height="55" rx="5" fill="#bcd5d0"/><rect x="213" y="164" width="30" height="55" rx="5" fill="#bcd5d0"/><rect x="362" y="102" width="246" height="154" rx="14" fill="#efeafb" stroke="#ab99d6"/><text x="388" y="135" class="label">排序与过滤</text><text x="388" y="178" class="small">相关性 / 版本</text><text x="388" y="207" class="small">权限 / 去重</text><rect x="680" y="102" width="244" height="154" rx="14" fill="#f9e9e2" stroke="#d98c73"/><text x="702" y="135" class="label">证据集合 (Top-n)</text><text x="702" y="178" class="small">可用 token 预算</text><text x="702" y="207" class="small">来源 ID [S1] [S2]</text><path d="M292 178 L357 178" stroke="#568a87" fill="none" stroke-width="3" marker-end="url(#arrow)"/><path d="M609 178 L675 178" stroke="#568a87" fill="none" stroke-width="3" marker-end="url(#arrow)"/><text x="37" y="312" class="note">Top-k / Top-n 是调参，不是固定最佳值；要在标注查询集上评估。</text></svg>