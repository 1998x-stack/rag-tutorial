<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 451" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">向量长度会影响点积排序</title><desc id="svg-desc">用人为设置的 2D 向量演示 q=(1,0)、D1=(0.9,0.1)、D2=(3,3) 时，原始点积与余弦的排序不同。</desc><defs><marker id="ar-147f80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#147f80"/></marker><marker id="ar-d06d4d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#d06d4d"/></marker><marker id="ar-7461ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7461ba"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:22px;font-weight:760}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:#4c686c}.tiny{font-size:14px;fill:#4c686c}.accent{font-size:14px;font-weight:720;fill:#147f80}.warning{font-size:14px;font-weight:680;fill:#ac583a}.white{fill:white;font-size:15px;font-weight:700}.num{font-size:19px;font-weight:750;fill:#20494a}</style><rect x="0" y="0" width="1080" height="451" rx="22" fill="#f7faf8"/><text x="37" y="49" class="title" >看方向还是看长度：评分函数决定排序</text><rect x="38" y="90" width="574" height="319" fill="#fff" stroke="#ceddd8" stroke-width="1.5" rx="12"/><path d="M115 355 L555 355 M115 355 L115 116" stroke="#8ba7a3" stroke-width="2.2"/><path d="M115,355 L320,355" fill="none" stroke="#147f80" stroke-width="2.6"  marker-end="url(#ar-147f80)"/><text x="329" y="355" class="label" >q = (1,0)</text><path d="M115,355 L302,334" fill="none" stroke="#7461ba" stroke-width="2.6"  marker-end="url(#ar-7461ba)"/><text x="309" y="324" class="small" >D1 = (0.9,0.1)</text><path d="M115,355 L476,156" fill="none" stroke="#d06d4d" stroke-width="2.6"  marker-end="url(#ar-d06d4d)"/><text x="336" y="141" class="small" >D2 = (3,3)</text><text x="63" y="389" class="tiny" >坐标位置与向量比例是说明性示意</text><rect x="660" y="101" width="385" height="102" fill="#fff0e7" stroke="#dda08d" stroke-width="1.5" rx="13"/><text x="676" y="132" class="label" >原始内积</text><text x="676" y="157" class="small" >q·D1=0.9 ； q·D2=3.0</text><rect x="660" y="224" width="385" height="102" fill="#e2f1ee" stroke="#7db6a9" stroke-width="1.5" rx="13"/><text x="676" y="255" class="label" >余弦相似度</text><text x="676" y="280" class="small" >cos(q,D1)≈0.994 ＞ 0.707</text><text x="663" y="379" class="small" >先规定度量、规范化和查询/文档编码方式。</text></svg>