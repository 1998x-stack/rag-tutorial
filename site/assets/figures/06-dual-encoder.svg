<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 452" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">双编码器如何分离离线与在线计算</title><desc id="svg-desc">文档编码离线计算并缓存，查询编码在线计算，向量相似度用于检索；交叉编码器可作为候选重排序。 </desc><defs><marker id="ar-147f80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#147f80"/></marker><marker id="ar-d06d4d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#d06d4d"/></marker><marker id="ar-7461ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7461ba"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:22px;font-weight:760}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:#4c686c}.tiny{font-size:14px;fill:#4c686c}.accent{font-size:14px;font-weight:720;fill:#147f80}.warning{font-size:14px;font-weight:680;fill:#ac583a}.white{fill:white;font-size:15px;font-weight:700}.num{font-size:19px;font-weight:750;fill:#20494a}</style><rect x="0" y="0" width="1080" height="452" rx="22" fill="#f7faf8"/><text x="38" y="50" class="title" >文档向量可预计算，查询向量在请求时生成</text><rect x="36" y="109" width="240" height="90" fill="#e9f5f2" stroke="#7bb9ad" stroke-width="1.5" rx="13"/><text x="52" y="140" class="label" >文档片段 d</text><text x="52" y="165" class="small" >离线批处理</text><rect x="340" y="109" width="251" height="90" fill="#e7f1fb" stroke="#9cb8d8" stroke-width="1.5" rx="13"/><text x="356" y="140" class="label" >文档编码器 E_d</text><text x="356" y="165" class="small" >可以不同于 E_q</text><rect x="668" y="109" width="374" height="90" fill="#e9f5f2" stroke="#7bb9ad" stroke-width="1.5" rx="13"/><text x="684" y="140" class="label" >索引 D ∈ R^(N×d)</text><text x="684" y="165" class="small" >向量 + 来源 ID + 权限元数据</text><path d="M277,153 L335,153" fill="none" stroke="#147f80" stroke-width="2.6"  marker-end="url(#ar-147f80)"/><path d="M592,153 L663,153" fill="none" stroke="#147f80" stroke-width="2.6"  marker-end="url(#ar-147f80)"/><rect x="36" y="279" width="240" height="90" fill="#e9f5f2" stroke="#7bb9ad" stroke-width="1.5" rx="13"/><text x="52" y="310" class="label" >用户问题 q</text><text x="52" y="335" class="small" >在线请求</text><rect x="340" y="279" width="251" height="90" fill="#ede9f7" stroke="#aba0d3" stroke-width="1.5" rx="13"/><text x="356" y="310" class="label" >查询编码器 E_q</text><text x="356" y="335" class="small" >维度/空间必须兼容</text><rect x="668" y="279" width="374" height="90" fill="#fff0e7" stroke="#dba48b" stroke-width="1.5" rx="13"/><text x="684" y="310" class="label" >Top-k → rerank（可选）</text><text x="684" y="335" class="small" >把候选证据交给生成器</text><path d="M277,322 L335,322" fill="none" stroke="#7461ba" stroke-width="2.6"  marker-end="url(#ar-7461ba)"/><path d="M592,322 L663,322" fill="none" stroke="#7461ba" stroke-width="2.6"  marker-end="url(#ar-7461ba)"/><path d="M856,204 L856,275" fill="none" stroke="#147f80" stroke-width="2.6"  marker-end="url(#ar-147f80)"/><text x="38" y="418" class="small" >Encoder 权重不要求相同；但训练与部署配置必须让 q 与 d 的得分可比较。</text></svg>