<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 452" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">Embedding 检索模型选型需要哪些验证</title><desc id="svg-desc">把测试集覆盖、召回精度、延迟成本、版本兼容和权限过滤作为联合评估维度，不用单一排行榜决定。 </desc><defs><marker id="ar-147f80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#147f80"/></marker><marker id="ar-d06d4d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#d06d4d"/></marker><marker id="ar-7461ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7461ba"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:22px;font-weight:760}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:#4c686c}.tiny{font-size:14px;fill:#4c686c}.accent{font-size:14px;font-weight:720;fill:#147f80}.warning{font-size:14px;font-weight:680;fill:#ac583a}.white{fill:white;font-size:15px;font-weight:700}.num{font-size:19px;font-weight:750;fill:#20494a}</style><rect x="0" y="0" width="1080" height="452" rx="22" fill="#f7faf8"/><text x="38" y="49" class="title" >选模型：先固定数据集和指标，再比较方案</text><rect x="39" y="100" width="320" height="96" fill="#e9f5f2" stroke="#7bb9ad" stroke-width="1.5" rx="13"/><text x="55" y="131" class="label" >标注查询集</text><text x="55" y="156" class="small" >短/长/跨语种/版本/术语</text><rect x="386" y="100" width="320" height="96" fill="#e9f5f2" stroke="#7bb9ad" stroke-width="1.5" rx="13"/><text x="402" y="131" class="label" >检索回归</text><text x="402" y="156" class="small" >Recall@k / nDCG / MRR</text><rect x="736" y="100" width="305" height="96" fill="#e9f5f2" stroke="#7bb9ad" stroke-width="1.5" rx="13"/><text x="752" y="131" class="label" >工程约束</text><text x="752" y="156" class="small" >p95 / 存储 / 版本 / ACL</text><path d="M360,148 L381,148" fill="none" stroke="#147f80" stroke-width="2.6"  marker-end="url(#ar-147f80)"/><path d="M707,148 L731,148" fill="none" stroke="#147f80" stroke-width="2.6"  marker-end="url(#ar-147f80)"/><rect x="39" y="251" width="1000" height="141" fill="#fff" stroke="#d4e4de" stroke-width="1.5" rx="12"/><text x="65" y="288" class="small" >数据不变：固定训练 / 验证 / 测试切分；记录模型与 prompt 配置。</text><text x="65" y="321" class="small" >实验可比：相同 corpus、过滤条件、索引新鲜度、top-k 与候选池。</text><text x="65" y="353" class="small" >上线可回滚：新旧向量不要未经校准直接混排。</text><text x="39" y="424" class="warning" >跨版本模型分数、维度与归一化方案不必一致，不可未经评估直接替换。</text></svg>