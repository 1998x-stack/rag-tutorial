<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 445" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">对比学习为什么需要困难负例</title><desc id="svg-desc">查询向量需要靠近正样本，远离容易混淆的难负例；示意不是测得的真实训练效果。 </desc><defs><marker id="ar-147f80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#147f80"/></marker><marker id="ar-d06d4d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#d06d4d"/></marker><marker id="ar-7461ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7461ba"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:22px;font-weight:760}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:#4c686c}.tiny{font-size:14px;fill:#4c686c}.accent{font-size:14px;font-weight:720;fill:#147f80}.warning{font-size:14px;font-weight:680;fill:#ac583a}.white{fill:white;font-size:15px;font-weight:700}.num{font-size:19px;font-weight:750;fill:#20494a}</style><rect x="0" y="0" width="1080" height="445" rx="22" fill="#f7faf8"/><text x="37" y="48" class="title" >学习目标：把“看似相关但答不对”的负例推远</text><rect x="38" y="118" width="255" height="107" fill="#e9f5f2" stroke="#7bb9ad" stroke-width="1.5" rx="13"/><text x="54" y="149" class="label" >查询 q</text><text x="54" y="174" class="small" >“2026 版退款几天？”</text><rect x="407" y="94" width="277" height="100" fill="#dcf0e8" stroke="#7bb9a9" stroke-width="1.5" rx="13"/><text x="423" y="125" class="label" >正例 d+</text><text x="423" y="150" class="small" >“2026版：7天内可退款”</text><rect x="407" y="234" width="277" height="100" fill="#fff0e7" stroke="#dfa38b" stroke-width="1.5" rx="13"/><text x="423" y="265" class="label" >困难负例 d−</text><text x="423" y="290" class="small" >“2025版：3天内可退款”</text><path d="M294,164 L402,144" fill="none" stroke="#147f80" stroke-width="2.6"  marker-end="url(#ar-147f80)"/><path d="M294,174 L402,274" fill="none" stroke="#d06d4d" stroke-width="2.6"  marker-end="url(#ar-d06d4d)"/><rect x="754" y="110" width="289" height="100" fill="#e9f5f2" stroke="#7bb9ad" stroke-width="1.5" rx="13"/><text x="770" y="141" class="label" >学习的任务</text><text x="770" y="166" class="small" >score(q,d+) ↑</text><rect x="754" y="239" width="289" height="100" fill="#ede9f7" stroke="#afa3d6" stroke-width="1.5" rx="13"/><text x="770" y="270" class="label" >注意的边界</text><text x="770" y="295" class="small" >不要把答案冲突误作正例</text><text x="43" y="392" class="small" >负例需要采样与标注；同义改写和版本冲突可能改变正负标签。</text></svg>