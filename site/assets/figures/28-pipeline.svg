<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" role="img" aria-labelledby="t28p d28p">
<title id="t28p">端到端 RAG 流水线：上半部分是离线入库，下半部分是在线查询，评估回路连接两者</title>
<desc id="d28p">离线入库从多格式文档源开始，经过解析与结构化、分块、嵌入，写入向量与倒排索引。在线查询先查语义缓存，未命中则做查询改写，再进行混合检索与重排，最后生成带引用的答案。评估回路用标注集衡量检索与生成质量，把结论反馈到分块与检索参数上。</desc>
<style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.k{font-size:22px;font-weight:760}.l{font-size:13.5px;font-weight:720}.s{font-size:11.5px;fill:#4c686c}.lane{font-size:12px;font-weight:720}</style>
<rect x="0" y="0" width="1080" height="440" rx="22" fill="#f7faf8"/>
<text x="38" y="44" class="k">一次入库，长期服务；评估把两端连起来</text>
<text x="50" y="78" class="lane" fill="#147f80">离线 / 入库（数据管线）</text>
<rect x="50" y="90" width="160" height="60" rx="11" fill="#eef7f5" stroke="#147f80" stroke-width="2"/>
<text x="70" y="118" class="l">多格式文档源</text><text x="70" y="136" class="s">PDF / Wiki / 手册</text>
<rect x="240" y="90" width="160" height="60" rx="11" fill="#eef7f5" stroke="#147f80" stroke-width="2"/>
<text x="260" y="118" class="l">解析 / 结构化</text><text x="260" y="136" class="s">保留阅读顺序、表格</text>
<rect x="430" y="90" width="150" height="60" rx="11" fill="#eef7f5" stroke="#147f80" stroke-width="2"/>
<text x="450" y="118" class="l">分块</text><text x="450" y="136" class="s">父子块 / 重叠</text>
<rect x="610" y="90" width="150" height="60" rx="11" fill="#eef7f5" stroke="#147f80" stroke-width="2"/>
<text x="630" y="118" class="l">嵌入</text><text x="630" y="136" class="s">同一模型编码</text>
<rect x="790" y="90" width="240" height="60" rx="11" fill="#eef7f5" stroke="#147f80" stroke-width="2"/>
<text x="810" y="118" class="l">索引</text><text x="810" y="136" class="s">向量索引 + 倒排（BM25）</text>
<path d="M210 120 H236 M400 120 H426 M580 120 H606 M760 120 H786" stroke="#7f9a97" stroke-width="2.5" marker-end="url(#a28p)"/>
<rect x="50" y="230" width="980" height="26" rx="8" fill="#e7f1ee" stroke="#bfd8d2"/>
<text x="66" y="249" class="s">共享存储：向量索引与倒排索引（在线查询从这里取候选）</text>
<path d="M910 150 V226" stroke="#147f80" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#a28p)"/>
<text x="50" y="290" class="lane" fill="#b4552f">在线 / 查询（服务路径）</text>
<rect x="50" y="302" width="130" height="62" rx="11" fill="#fff1e8" stroke="#d06d4d" stroke-width="2"/>
<text x="66" y="328" class="l">用户查询</text><text x="66" y="346" class="s">自然语言</text>
<rect x="204" y="302" width="130" height="62" rx="11" fill="#ede9f7" stroke="#7461ba" stroke-width="2"/>
<text x="220" y="328" class="l">语义缓存</text><text x="220" y="346" class="s">未命中才继续</text>
<rect x="358" y="302" width="130" height="62" rx="11" fill="#fff1e8" stroke="#d06d4d" stroke-width="2"/>
<text x="374" y="328" class="l">查询改写</text><text x="374" y="346" class="s">术语保持</text>
<rect x="512" y="302" width="150" height="62" rx="11" fill="#eef7f5" stroke="#147f80" stroke-width="2"/>
<text x="528" y="328" class="l">混合检索</text><text x="528" y="346" class="s">稠密 + 稀疏</text>
<rect x="686" y="302" width="130" height="62" rx="11" fill="#eef7f5" stroke="#147f80" stroke-width="2"/>
<text x="702" y="328" class="l">重排</text><text x="702" y="346" class="s">交叉编码器</text>
<rect x="840" y="302" width="190" height="62" rx="11" fill="#fff1e8" stroke="#d06d4d" stroke-width="2"/>
<text x="856" y="328" class="l">生成 + 引用</text><text x="856" y="346" class="s">输出带出处、可核查</text>
<path d="M180 333 H200 M334 333 H354 M488 333 H508 M662 333 H682 M816 333 H836" stroke="#7f9a97" stroke-width="2.5" marker-end="url(#a28p)"/>
<rect x="50" y="392" width="980" height="30" rx="9" fill="#f0f2f4" stroke="#c8d3d0"/>
<text x="66" y="412" class="s">评估回路：标注集 → 检索与生成指标 → 回改分块 / 检索参数 / 提示词（见第五节）</text>
<defs><marker id="a28p" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#7f9a97"/></marker></defs>
</svg>
