<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" role="img" aria-labelledby="t-08-inverted d-08-inverted"><title id="t-08-inverted">倒排索引以词项为中心记录文档列表</title><desc id="d-08-inverted">三篇文档被转换为一张表：每个词项映射到包含它的文档 ID 与词频，查询时只需查对应词项的列表。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.k{font-size:22px;font-weight:760}.l{font-size:17px;font-weight:700}.s{font-size:15px;fill:#4c686c}.a{font-size:14px;font-weight:720;fill:#147f80}</style><rect x="0" y="0" width="1080" height="400" rx="22" fill="#f7faf8"/><text x="38" y="46" class="k">从“文档包含哪些词”翻转为“词出现在哪些文档”</text><g><rect x="60" y="80" width="200" height="58" rx="10" fill="#e2f1ee" stroke="#7db6a9"/><text x="76" y="106" class="l">D1</text><text x="76" y="128" class="s">我喜欢苹果</text><rect x="290" y="80" width="200" height="58" rx="10" fill="#e2f1ee" stroke="#7db6a9"/><text x="306" y="106" class="l">D2</text><text x="306" y="128" class="s">苹果很好吃</text><rect x="520" y="80" width="200" height="58" rx="10" fill="#e2f1ee" stroke="#7db6a9"/><text x="536" y="106" class="l">D3</text><text x="536" y="128" class="s">我喜欢香蕉</text></g><text x="760" y="116" class="a">正排：扫描每篇</text><rect x="60" y="175" width="960" height="196" rx="12" fill="#fff" stroke="#ceddd8" stroke-width="1.5"/><text x="80" y="207" class="l">倒排索引（词 → 文档列表）</text><text x="80" y="244" class="s">我</text><rect x="150" y="226" width="200" height="26" rx="6" fill="#eef7f5" stroke="#a9cfc6"/><text x="162" y="245" class="s">D1, D3</text><text x="80" y="282" class="s">苹果</text><rect x="150" y="264" width="200" height="26" rx="6" fill="#eef7f5" stroke="#a9cfc6"/><text x="162" y="283" class="s">D1, D2</text><text x="80" y="320" class="s">好吃</text><rect x="150" y="302" width="200" height="26" rx="6" fill="#eef7f5" stroke="#a9cfc6"/><text x="162" y="321" class="s">D2</text><text x="80" y="358" class="s">香蕉</text><rect x="150" y="340" width="200" height="26" rx="6" fill="#eef7f5" stroke="#a9cfc6"/><text x="162" y="359" class="s">D3</text></svg>
