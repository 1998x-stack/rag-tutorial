<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-labelledby="t-07-hnsw d-07-hnsw"><title id="t-07-hnsw">HNSW 分层图的导航过程</title><desc id="d-07-hnsw">查询从顶层入口点出发，每层贪心移动到更近的邻居，再下降到下一层，直到最底层找到目标附近的近邻。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.k{font-size:22px;font-weight:760}.l{font-size:17px;font-weight:700}.s{font-size:15px;fill:#4c686c}.a{font-size:14px;font-weight:720;fill:#147f80}</style><rect x="0" y="0" width="1080" height="430" rx="22" fill="#f7faf8"/><text x="38" y="46" class="k">从稀疏上层跳到目标区域，再逐层下降</text><line x1="70" y1="300" x2="1010" y2="300" stroke="#8ba7a3" stroke-width="1.4" stroke-dasharray="5 5"/><line x1="70" y1="200" x2="1010" y2="200" stroke="#8ba7a3" stroke-width="1.4" stroke-dasharray="5 5"/><text x="70" y="132" class="s">层 2（稀疏）</text><text x="70" y="228" class="s">层 1</text><text x="70" y="328" class="s">层 0（全部节点）</text><g fill="#e2f1ee" stroke="#147f80" stroke-width="2"><circle cx="300" cy="180" r="11"/><circle cx="620" cy="160" r="11"/><circle cx="860" cy="190" r="11"/><line x1="300" y1="180" x2="620" y2="160" stroke="#7db6a9" stroke-width="1.6"/><line x1="620" y1="160" x2="860" y2="190" stroke="#7db6a9" stroke-width="1.6"/></g><g fill="#ede9f7" stroke="#7461ba" stroke-width="1.6"><circle cx="180" cy="240" r="8"/><circle cx="300" cy="250" r="8"/><circle cx="470" cy="235" r="8"/><circle cx="620" cy="250" r="8"/><circle cx="760" cy="240" r="8"/><circle cx="900" cy="255" r="8"/><line x1="180" y1="240" x2="300" y2="250" stroke="#aaa1d3" stroke-width="1.3"/><line x1="620" y1="250" x2="760" y2="240" stroke="#aaa1d3" stroke-width="1.3"/><line x1="760" y1="240" x2="900" y2="255" stroke="#aaa1d3" stroke-width="1.3"/></g><g fill="#e2f1ee" stroke="#147f80" stroke-width="1.6"><circle cx="120" cy="360" r="7"/><circle cx="210" cy="370" r="7"/><circle cx="300" cy="355" r="7"/><circle cx="390" cy="372" r="7"/><circle cx="470" cy="358" r="7"/><circle cx="560" cy="370" r="7"/><circle cx="640" cy="355" r="7"/><circle cx="720" cy="372" r="7"/><circle cx="800" cy="358" r="7"/><circle cx="880" cy="370" r="7"/><circle cx="950" cy="356" r="7"/><line x1="120" y1="360" x2="210" y2="370" stroke="#7db6a9" stroke-width="1.1"/><line x1="210" y1="370" x2="300" y2="355" stroke="#7db6a9" stroke-width="1.1"/><line x1="300" y1="355" x2="390" y2="372" stroke="#7db6a9" stroke-width="1.1"/><line x1="390" y1="372" x2="470" y2="358" stroke="#7db6a9" stroke-width="1.1"/><line x1="470" y1="358" x2="560" y2="370" stroke="#7db6a9" stroke-width="1.1"/><line x1="560" y1="370" x2="640" y2="355" stroke="#7db6a9" stroke-width="1.1"/><line x1="640" y1="355" x2="720" y2="372" stroke="#7db6a9" stroke-width="1.1"/><line x1="720" y1="372" x2="800" y2="358" stroke="#7db6a9" stroke-width="1.1"/><line x1="800" y1="358" x2="880" y2="370" stroke="#7db6a9" stroke-width="1.1"/></g><circle cx="860" cy="190" r="6" fill="#d06d4d"/><text x="876" y="176" class="a">入口点</text><circle cx="800" cy="358" r="10" fill="#d06d4d" opacity="0.85"/><text x="742" y="398" class="a">命中近邻</text><text x="70" y="414" class="s">节点位置与连线数量为说明性示意，不代表真实坐标</text></svg>
