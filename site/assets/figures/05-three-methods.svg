<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 451" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">三种上下文增强方法的计算时序</title><desc id="svg-desc">常规切块先分再编码；Late Chunking 先编码整个 token 序列再对指定区间池化；Contextual Retrieval 给每块加说明再索引。 </desc><defs><marker id="ar-147f80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#147f80"/></marker><marker id="ar-d06d4d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#d06d4d"/></marker><marker id="ar-7461ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7461ba"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:22px;font-weight:760}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:#4c686c}.tiny{font-size:14px;fill:#4c686c}.accent{font-size:14px;font-weight:720;fill:#147f80}.warning{font-size:14px;font-weight:680;fill:#ac583a}.white{fill:white;font-size:15px;font-weight:700}.num{font-size:19px;font-weight:750;fill:#20494a}</style><rect x="0" y="0" width="1080" height="451" rx="22" fill="#f7faf8"/><text x="36" y="48" class="title" >三种方法的“上下文”不是同一件事</text><text x="36" y="96" class="accent" >A · 常规 early chunking</text><rect x="42" y="112" width="278" height="79" fill="#e9f5f2" stroke="#7bb9ad" stroke-width="1.5" rx="13"/><text x="58" y="143" class="label" >先按边界分块</text><text x="58" y="168" class="small" >[A] [B] [C]</text><rect x="406" y="112" width="283" height="79" fill="#e9f5f2" stroke="#7bb9ad" stroke-width="1.5" rx="13"/><text x="422" y="143" class="label" >分别送入编码器</text><text x="422" y="168" class="small" >encode(A), encode(B)…</text><rect x="770" y="112" width="275" height="79" fill="#e9f5f2" stroke="#7bb9ad" stroke-width="1.5" rx="13"/><text x="786" y="143" class="label" >各自池化</text><text x="786" y="168" class="small" >每块一个向量</text><path d="M321,152 L401,152" fill="none" stroke="#147f80" stroke-width="2.6"  marker-end="url(#ar-147f80)"/><path d="M690,152 L765,152" fill="none" stroke="#147f80" stroke-width="2.6"  marker-end="url(#ar-147f80)"/><text x="36" y="246" class="accent" >B · Late Chunking</text><rect x="42" y="259" width="278" height="79" fill="#e9f5f2" stroke="#7bb9ad" stroke-width="1.5" rx="13"/><text x="58" y="290" class="label" >整段 tokens</text><text x="58" y="315" class="small" >依赖支持长序列的模型</text><rect x="406" y="259" width="283" height="79" fill="#ede9f7" stroke="#aea1d5" stroke-width="1.5" rx="13"/><text x="422" y="290" class="label" >整段 token 表征</text><text x="422" y="315" class="small" >编码器先做跨块交互</text><rect x="770" y="259" width="275" height="79" fill="#e9f5f2" stroke="#7bb9ad" stroke-width="1.5" rx="13"/><text x="786" y="290" class="label" >按区间池化</text><text x="786" y="315" class="small" >每个 chunk 一个向量</text><path d="M321,298 L401,298" fill="none" stroke="#7461ba" stroke-width="2.6"  marker-end="url(#ar-7461ba)"/><path d="M690,298 L765,298" fill="none" stroke="#7461ba" stroke-width="2.6"  marker-end="url(#ar-7461ba)"/><rect x="38" y="373" width="1004" height="49" fill="#fff" stroke="#d0dfda" stroke-width="1.5" rx="12"/><text x="54" y="403" class="small" >C · Contextual Retrieval：先为 chunk 附上文档级说明，再生成索引表示（也可供 BM25 使用）。</text></svg>