<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title description"><title id="title">上下文预算如何分配</title><desc id="description">总窗口由系统指令、问题、证据和预留输出共同占据，而非全部用于证据。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#568a87"/></marker></defs><rect width="960" height="360" rx="20" fill="#f7faf8"/><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#203035}.small{font-size:15px;fill:#556c70}.title{font-size:22px;font-weight:750}.label{font-size:18px;font-weight:680}.note{font-size:14px;fill:#556c70}</style><text x="34" y="46" class="title">窗口大小不是证据可用容量</text><rect x="38" y="96" width="885" height="96" rx="12" fill="#e3edea"/><rect x="38" y="96" width="96" height="96" rx="12" fill="#7461ba"/><rect x="134" y="96" width="165" height="96" fill="#d06d4d"/><rect x="299" y="96" width="474" height="96" fill="#147f80"/><rect x="773" y="96" width="150" height="96" rx="12" fill="#baa9e1"/><text x="86" y="150" text-anchor="middle" fill="white" style="fill:white;font-size:14px">系统</text><text x="215" y="150" text-anchor="middle" style="fill:white;font-size:15px">用户输入</text><text x="536" y="150" text-anchor="middle" style="fill:white;font-size:18px">检索上下文</text><text x="849" y="150" text-anchor="middle" style="fill:#203035;font-size:15px">生成预留</text><text x="38" y="251" class="small">只是示意比例：真实 token 数取决于模板、模型分词器与输出上限。</text><text x="38" y="289" class="note">Window ≥ instructions + question + retrieved context + reserved output</text></svg>