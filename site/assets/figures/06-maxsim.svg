<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 451" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">ColBERT MaxSim 的逐 token 匹配</title><desc id="svg-desc">每个查询 token 对文档 token 的最大相似度求和，而不是把整段文档压成唯一向量。 </desc><defs><marker id="ar-147f80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#147f80"/></marker><marker id="ar-d06d4d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#d06d4d"/></marker><marker id="ar-7461ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7461ba"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:22px;font-weight:760}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:#4c686c}.tiny{font-size:14px;fill:#4c686c}.accent{font-size:14px;font-weight:720;fill:#147f80}.warning{font-size:14px;font-weight:680;fill:#ac583a}.white{fill:white;font-size:15px;font-weight:700}.num{font-size:19px;font-weight:750;fill:#20494a}</style><rect x="0" y="0" width="1080" height="451" rx="22" fill="#f7faf8"/><text x="37" y="48" class="title" >Late interaction：每个查询 token 找最匹配的文档 token</text><text x="39" y="91" class="small" >相似度矩阵（人为设定的数值，非模型输出）</text><text x="54" y="155" class="label" >q1</text><text x="54" y="230" class="label" >q2</text><text x="160" y="107" class="label" >d1</text><text x="294" y="107" class="label" >d2</text><text x="428" y="107" class="label" >d3</text><rect x="115" y="123" width="112" height="62" fill="#c5e9dc" stroke="#4fa796" stroke-width="1.5" rx="7"/><text x="171" y="160" class="small" text-anchor="middle">0.9</text><rect x="249" y="123" width="112" height="62" fill="#fff" stroke="#d3dedb" stroke-width="1.5" rx="7"/><text x="305" y="160" class="small" text-anchor="middle">0.2</text><rect x="383" y="123" 