<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title description"><title id="title">RAG 离线与在线双路径</title><desc id="description">离线文档解析并建立索引；在线查询索引并把证据交给生成模型。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#568a87"/></marker></defs><rect width="960" height="360" rx="20" fill="#f7faf8"/><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#203035}.small{font-size:15px;fill:#556c70}.title{font-size:22px;font-weight:750}.label{font-size:18px;font-weight:680}.note{font-size:14px;fill:#556c70}</style><text x="34" y="46" class="title">写入一次，多次检索：两条不同延迟路径</text><text x="34" y="91" class="small">离线 / 更新时</text><rect x="36" y="106" width="182" height="80" rx="13" fill="#e4f3f0" stroke="#70aaa7" stroke-width="2"/><text x="127" y="140" text-anchor="middle" class="label">原始文档</text><text x="127" y="167" text-anchor="middle" class="small">PDF / HTML</text><rect x="269" y="106" width="182" height="80" rx="13" fill="#e4f3f0" stroke="#70aaa7" stroke-width="2"/><text x="360" y="140" text-anchor="middle" class="label">解析切块</text><text x="360" y="167" text-anchor="middle" class="small">ID / 元数据</text><rect x="501" y="106" width="182" height="80" rx="13" fill="#e4f3f0" stroke="#70aaa7" stroke-width="2"/><text x="592" y="140" text-anchor="middle" class="label">向量 + 文本</text><text x="592" y="167" text-anchor="middle" class="small">建立索引</text><path d="M218 147 L266 147" stroke="#568a87" fill="none" stroke-width="3" marker-end="url(#arrow)"/><path d="M451 147 L498 147" stroke="#568a87" fill="none" stroke-width="3" marker-end="url(#arrow)"/><text x="34" y="239" class="small">在线 / 每个请求</text><rect x="36" y="255" width="182" height="80" rx="13" fill="#e4f3f0" stroke="#70aaa7" stroke-width="2"/><text x="127" y="289" text-anchor="middle" class="label">用户查询</text><text x="127" y="316" text-anchor="middle" class="small">鉴权</text><rect x="269" y="255" width="182" height="80" rx="13" fill="#e4f3f0" stroke="#70aaa7" stroke-width="2"/><text x="360" y="289" text-anchor="middle" class="label">召回 + 精排</text><text x="360" y="316" text-anchor="middle" class="small">选定证据</text><rect x="501" y="255" width="182" height="80" rx="13" fill="#e4f3f0" stroke="#70aaa7" stroke-width="2"/><text x="592" y="289" text-anchor="middle" class="label">上下文构造</text><text x="592" y="316" text-anchor="middle" class="small">标记来源</text><rect x="733" y="255" width="182" height="80" rx="13" fill="#f9e9e2" stroke="#d98c73" stroke-width="2"/><text x="824" y="289" text-anchor="middle" class="label">模型生成</text><text x="824" y="316" text-anchor="middle" class="small">答案 / 拒答</text><path d="M218 295 L266 295" stroke="#568a87" fill="none" stroke-width="3" marker-end="url(#arrow)"/><path d="M451 295 L498 295" stroke="#568a87" fill="none" stroke-width="3" marker-end="url(#arrow)"/><path d="M683 295 L730 295" stroke="#568a87" fill="none" stroke-width="3" marker-end="url(#arrow)"/><path d="M591 186 L591 227 L365 227 L365 250" stroke="#7461ba" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/></svg>