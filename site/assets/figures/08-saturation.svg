<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" role="img" aria-labelledby="t-08-sat d-08-sat"><title id="t-08-sat">BM25 的词频贡献随出现次数饱和</title><desc id="d-08-sat">同一点项在文档中出现次数增加时，BM25 的 tf 贡献单调上升但趋于平缓；k1 越大，饱和越晚、上界越高。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.k{font-size:22px;font-weight:760}.l{font-size:16px;font-weight:700}.s{font-size:14px;fill:#4c686c}.a{font-size:14px;font-weight:700}</style><rect x="0" y="0" width="1080" height="400" rx="22" fill="#f7faf8"/><text x="38" y="46" class="k">词频不是线性加分：BM25 的 tf 贡献会饱和</text><line x1="90" y1="320" x2="600" y2="320" stroke="#8ba7a3" stroke-width="1.6"/><line x1="90" y1="320" x2="90" y2="90" stroke="#8ba7a3" stroke-width="1.6"/><text x="255" y="360" class="s">tf（词项出现次数，0–10）</text><text x="40" y="210" class="s" transform="rotate(-90 40 210)">tf 贡献</text><polyline points="90,320 141,265 192,254 243,249 294,247 345,245 396,244 447,243 498,242 549,242 600,241" fill="none" stroke="#7461ba" stroke-width="2.4"/><polyline points="90,320 141,265 192,244 243,234 294,227 345,222 396,219 447,217 498,215 549,213 600,212" fill="none" stroke="#147f80" stroke-width="2.8"/><polyline points="90,320 141,265 192,232 243,210 294,194 345,182 396,173 447,166 498,160 549,155 600,151" fill="none" stroke="#d06d4d" stroke-width="2.4"/><rect x="648" y="112" width="392" height="168" rx="12" fill="#fff" stroke="#ceddd8" stroke-width="1.5"/><text x="668" y="146" class="l">k1 取值 → 上界 k1+1</text><line x1="668" y1="176" x2="716" y2="176" stroke="#7461ba" stroke-width="2.6"/><text x="726" y="181" class="s">k1=0.5，上界 1.5</text><line x1="668" y1="212" x2="716" y2="212" stroke="#147f80" stroke-width="2.6"/><text x="726" y="217" class="s">k1=1.2，上界 2.2</text><line x1="668" y1="248" x2="716" y2="248" stroke="#d06d4d" stroke-width="2.6"/><text x="726" y="253" class="s">k1=3.0，上界 4.0</text><text x="90" y="388" class="s">曲线按公式在 |D|=avgdl 时绘制；仅展示形状，不是实测基准</text></svg>
