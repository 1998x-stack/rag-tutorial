<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" role="img" aria-labelledby="t22m d22m">
<title id="t22m">多索引路由：一个查询按类型分发给向量、关键词、时间或图谱索引，结果再合并排序</title>
<desc id="d22m">查询先经过路由器；路由器按内容特征决定激活哪些索引。向量索引处理语义相近，关键词索引处理编号与精确匹配，时间索引处理时间范围，图谱索引处理关系与多跳。各索引返回的结果合并后统一排序，再组装成上下文。</desc>
<style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.k{font-size:22px;font-weight:760}.l{font-size:13px;font-weight:720}.s{font-size:12px;fill:#4c686c}</style>
<rect x="0" y="0" width="1080" height="400" rx="22" fill="#f7faf8"/>
<text x="38" y="46" class="k">按查询类型分发，而不是所有查询都走向量</text>
<rect x="40" y="170" width="150" height="60" rx="12" fill="#fff1e8" stroke="#d06d4d" stroke-width="2"/><text x="62" y="206" class="l">查询</text>
<rect x="240" y="170" width="150" height="60" rx="12" fill="#ede9f7" stroke="#7461ba" stroke-width="2"/><text x="262" y="206" class="l">路由器</text>
<path d="M190 200 H236" stroke="#7f9a97" stroke-width="3" marker-end="url(#a22m)"/>
<rect x="470" y="86" width="200" height="52" rx="10" fill="#eef7f5" stroke="#147f80" stroke-width="2"/><text x="490" y="118" class="l">向量索引（语义）</text>
<rect x="470" y="150" width="200" height="52" rx="10" fill="#eef7f5" stroke="#147f80" stroke-width="2"/><text x="490" y="182" class="l">关键词索引（精确）</text>
<rect x="470" y="214" width="200" height="52" rx="10" fill="#eef7f5" stroke="#147f80" stroke-width="2"/><text x="490" y="246" class="l">时间索引（范围）</text>
<rect x="470" y="278" width="200" height="52" rx="10" fill="#eef7f5" stroke="#147f80" stroke-width="2"/><text x="490" y="310" class="l">图谱索引（关系）</text>
<path d="M390 200 C420 200 420 112 466 112 M390 200 C420 200 420 176 466 176 M390 200 C420 200 420 240 466 240 M390 200 C420 200 420 304 466 304" fill="none" stroke="#7f9a97" stroke-width="2.5" marker-end="url(#a22m)"/>
<rect x="760" y="170" width="270" height="60" rx="12" fill="#fff1e8" stroke="#d06d4d" stroke-width="2"/><text x="782" y="206" class="l">结果合并 → 排序 → 上下文</text>
<path d="M670 112 C730 112 730 200 756 200 M670 176 H756 M670 240 H756 M670 304 C730 304 730 200 756 200" fill="none" stroke="#7f9a97" stroke-width="2.5" marker-end="url(#a22m)"/>
<text x="40" y="360" class="s">路由规则可以是关键词、分类器或模型判断；它本身会误分，需要与各索引的检索质量分开评估。</text>
<text x="40" y="382" class="s">合并不同索引的分数要小心：不同索引的分数不可直接相加（见第九章与第十章）。</text>
<defs><marker id="a22m" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#7f9a97"/></marker></defs>
</svg>
