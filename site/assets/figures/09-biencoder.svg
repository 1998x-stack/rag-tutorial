<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-labelledby="t-09-bien d-09-bien"><title id="t-09-bien">双编码器分别编码查询与文档</title><desc id="d-09-bien">查询文字进入查询编码器得到查询向量，文档文字进入文档编码器得到文档向量，两个向量用相似度函数比对；两座编码器权重可以不共享。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.k{font-size:22px;font-weight:760}.l{font-size:16px;font-weight:700}.s{font-size:14px;fill:#4c686c}.a{font-size:14px;font-weight:720;fill:#147f80}</style><rect x="0" y="0" width="1080" height="430" rx="22" fill="#f7faf8"/><text x="38" y="46" class="k">两座塔各自编码，在共享空间里比对</text><rect x="60" y="92" width="220" height="56" rx="10" fill="#e2f1ee" stroke="#7db6a9"/><text x="76" y="126" class="s">查询：感冒该怎么办</text><rect x="60" y="180" width="220" height="64" rx="11" fill="#eef7f5" stroke="#147f80" stroke-width="2"/><text x="76" y="208" class="l">查询编码器 E_Q</text><text x="76" y="230" class="s">独立权重</text><rect x="60" y="284" width="220" height="52" rx="10" fill="#ede9f7" stroke="#7461ba"/><text x="76" y="316" class="l">向量 q</text><line x1="170" y1="148" x2="170" y2="180" stroke="#8ba7a3" stroke-width="2"/><line x1="170" y1="244" x2="170" y2="284" stroke="#8ba7a3" stroke-width="2"/><rect x="420" y="92" width="300" height="56" rx="10" fill="#e2f1ee" stroke="#7db6a9"/><text x="436" y="126" class="s">文档：上呼吸道感染的治疗方案</text><rect x="420" y="180" width="300" height="64" rx="11" fill="#eef7f5" stroke="#d06d4d" stroke-width="2"/><text x="436" y="208" class="l">文档编码器 E_P</text><text x="436" y="230" class="s">独立权重</text><rect x="420" y="284" width="300" height="52" rx="10" fill="#ede9f7" stroke="#7461ba"/><text x="436" y="316" class="l">向量 p</text><line x1="570" y1="148" x2="570" y2="180" stroke="#8ba7a3" stroke-width="2"/><line x1="570" y1="244" x2="570" y2="284" stroke="#8ba7a3" stroke-width="2"/><rect x="800" y="180" width="240" height="120" rx="12" fill="#fff" stroke="#ceddd8" stroke-width="1.5"/><text x="818" y="216" class="l">相似度</text><text x="818" y="248" class="s">sim(q, p)</text><text x="818" y="278" class="a">无共享词也能高</text><line x1="300" y1="310" x2="800" y2="248" stroke="#7461ba" stroke-width="1.8" stroke-dasharray="5 5"/><text x="60" y="400" class="s">插图：两塔可同构也可不同；权重是否共享是设计选择</text></svg>
