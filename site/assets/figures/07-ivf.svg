<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-labelledby="t-07-ivf d-07-ivf"><title id="t-07-ivf">IVF 用聚类分桶后只扫描 nprobe 个簇</title><desc id="d-07-ivf">向量被分到多个簇中，查询先找到最近的簇中心，只扫描选中的少数几个簇，未选中的簇不参与计算。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.k{font-size:22px;font-weight:760}.l{font-size:17px;font-weight:700}.s{font-size:15px;fill:#4c686c}.a{font-size:14px;font-weight:720;fill:#147f80}</style><rect x="0" y="0" width="1080" height="430" rx="22" fill="#f7faf8"/><text x="38" y="46" class="k">nprobe=2：只扫描查询最近的两个簇</text><rect x="38" y="80" width="740" height="320" rx="14" fill="#fff" stroke="#ceddd8" stroke-width="1.5"/><circle cx="180" cy="170" r="78" fill="#e2f1ee" stroke="#7db6a9" stroke-width="1.6"/><circle cx="360" cy="170" r="78" fill="#e2f1ee" stroke="#7db6a9" stroke-width="1.6"/><circle cx="260" cy="330" r="78" fill="#f1f4f3" stroke="#c8d3d0" stroke-width="1.4"/><circle cx="560" cy="300" r="78" fill="#f1f4f3" stroke="#c8d3d0" stroke-width="1.4"/><circle cx="620" cy="150" r="78" fill="#f1f4f3" stroke="#c8d3d0" stroke-width="1.4"/><g fill="#147f80"><circle cx="160" cy="150" r="4"/><circle cx="200" cy="185" r="4"/><circle cx="175" cy="205" r="4"/><circle cx="340" cy="150" r="4"/><circle cx="380" cy="180" r="4"/><circle cx="350" cy="205" r="4"/></g><g fill="#8ba7a3"><circle cx="240" cy="320" r="4"/><circle cx="275" cy="345" r="4"/><circle cx="555" cy="290" r="4"/><circle cx="590" cy="320" r="4"/><circle cx="610" cy="150" r="4"/><circle cx="645" cy="170" r="4"/></g><rect x="176" y="164" width="12" height="12" fill="#20494a"/><rect x="356" y="164" width="12" height="12" fill="#20494a"/><rect x="256" y="324" width="12" height="12" fill="#8ba7a3"/><rect x="556" y="294" width="12" height="12" fill="#8ba7a3"/><rect x="616" y="144" width="12" height="12" fill="#8ba7a3"/><circle cx="270" cy="250" r="8" fill="#d06d4d"/><text x="284" y="240" class="a">查询</text><line x1="270" y1="250" x2="182" y2="170" stroke="#d06d4d" stroke-width="2" stroke-dasharray="4 4"/><line x1="270" y1="250" x2="362" y2="170" stroke="#d06d4d" stroke-width="2" stroke-dasharray="4 4"/><text x="470" y="350" class="s">中心点=聚类质心；扫描范围仅限选中簇</text></svg>
