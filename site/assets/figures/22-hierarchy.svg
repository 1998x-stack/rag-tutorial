<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" role="img" aria-labelledby="t22h d22h">
<title id="t22h">层级索引把“在大海里捞针”变成逐层缩小搜索范围</title>
<desc id="d22h">查询先在文档摘要层定位到少数相关文档，再在章节摘要层缩小到具体章节，最后在分块层取出具体段落。每一层都把候选集合变小，因此最后一层的排序是在更小、更相关的空间里进行。</desc>
<style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.k{font-size:22px;font-weight:760}.l{font-size:14px;font-weight:720}.s{font-size:12px;fill:#4c686c}</style>
<rect x="0" y="0" width="1080" height="400" rx="22" fill="#f7faf8"/>
<text x="38" y="46" class="k">逐层缩小搜索空间：先找大海，再找针</text>
<rect x="90" y="96" width="720" height="60" rx="12" fill="#eef7f5" stroke="#147f80" stroke-width="2"/>
<text x="110" y="132" class="l">第 1 层：文档摘要 — 定位少数相关文档</text>
<rect x="170" y="176" width="560" height="60" rx="12" fill="#eef7f5" stroke="#147f80" stroke-width="2"/>
<text x="190" y="212" class="l">第 2 层：章节摘要 — 缩小到具体章节</text>
<rect x="260" y="256" width="380" height="60" rx="12" fill="#eef7f5" stroke="#147f80" stroke-width="2"/>
<text x="280" y="292" class="l">第 3 层：分块 — 取出具体段落</text>
<path d="M450 66 V92" stroke="#7f9a97" stroke-width="3" marker-end="url(#a22)"/>
<text x="380" y="80" class="s">查询</text>
<path d="M450 156 V172 M450 236 V252 M450 316 V344" stroke="#7f9a97" stroke-width="3" marker-end="url(#a22)"/>
<rect x="330" y="344" width="240" height="44" rx="10" fill="#fff1e8" stroke="#d06d4d" stroke-width="2"/>
<text x="354" y="372" class="l">重组成生成上下文</text>
<text x="40" y="386" class="s">每一层都用一个更小的候选集去排序；层次可用递归聚类与摘要构建（如 RAPTOR）。层数越多，构建与维护成本越高。</text>
<defs><marker id="a22" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#7f9a97"/></marker></defs>
</svg>
