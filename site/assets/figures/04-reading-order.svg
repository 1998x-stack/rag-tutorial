<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 446" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">PDF 阅读顺序为什么会错</title><desc id="svg-desc">左侧 PDF 双栏文本的视觉顺序与抽取出的错误顺序对比，右侧结构恢复后段落可检索。</desc><defs><marker id="ar-147f80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#147f80"/></marker><marker id="ar-d06d4d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#d06d4d"/></marker><marker id="ar-7461ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7461ba"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:22px;font-weight:760}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:#4c686c}.tiny{font-size:14px;fill:#4c686c}.accent{font-size:14px;font-weight:720;fill:#147f80}.warning{font-size:14px;font-weight:680;fill:#ac583a}.white{fill:white;font-size:15px;font-weight:700}.num{font-size:19px;font-weight:750;fill:#20494a}</style><rect x="0" y="0" width="1080" height="446" rx="22" fill="#f7faf8"/><text x="38" y="46" class="title" >两个栏的 PDF：坐标不等于段落语义</text><text x="38" y="83" class="accent" >PDF 页面坐标</text><rect x="38" y="102" width="410" height="288" fill="#fff" stroke="#bfcfcb" stroke-width="1.5" rx="14"/><rect x="58" y="122" width="175" height="36" fill="#e4f2ef" stroke="#85bcb0" stroke-width="1.5" rx="7"/><text x="145.5" y="146" class="small" text-anchor="middle">左栏 · 定义</text><rect x="252" y="122" width="175" height="36" fill="#f2e9fb" stroke="#baa9db" stroke-width="1.5" rx="7"/><text x="339.5" y="146" class="small" text-anchor="middle">右栏 · 结论</text><rect x="62" y="180" width="165" height="13" fill="#d7e8e4" stroke="none" stroke-width="1.5" rx="4"/><rect x="62" y="216" width="165" height="13" fill="#d7e8e4" stroke="none" stroke-width="1.5" rx="4"/><rect x="62" y="252" width="165" height="13" fill="#d7e8e4" stroke="none" stroke-width="1.5" rx="4"/><rect x="62" y="288" width="165" height="13" fill="#d7e8e4" stroke="none" stroke-width="1.5" rx="4"/><rect x="255" y="180" width="162" height="13" fill="#ded5f0" stroke="none" stroke-width="1.5" rx="4"/><rect x="255" y="216" width="162" height="13" fill="#ded5f0" stroke="none" stroke-width="1.5" rx="4"/><rect x="255" y="252" width="162" height="13" fill="#ded5f0" stroke="none" stroke-width="1.5" rx="4"/><rect x="255" y="288" width="162" height="13" fill="#ded5f0" stroke="none" stroke-width="1.5" rx="4"/><text x="62" y="359" class="small" >A1 → A2 → A3 → A4</text><text x="255" y="359" class="small" >B1 → B2 → B3 → B4</text><path d="M456,235 L510,235" fill="none" stroke="#147f80" stroke-width="2.6"  marker-end="url(#ar-147f80)"/><text x="522" y="83" class="warning" >错误的逐行拼接</text><rect x="515" y="115" width="525" height="74" fill="#fbeee7" stroke="#dc9d80" stroke-width="1.5" rx="13"/><text x="531" y="146" class="label" >A1 / B1 / A2 / B2</text><text x="531" y="171" class="small" >把两种主题交错，切块之后难以恢复</text><path d="M772,194 L772,230" fill="none" stroke="#d06d4d" stroke-width="2.6"  marker-end="url(#ar-d06d4d)"/><text x="522" y="255" class="accent" >结构化恢复：先按栏，再按块</text><rect x="515" y="272" width="525" height="74" fill="#e9f5f2" stroke="#7bb9ad" stroke-width="1.5" rx="13"/><text x="531" y="303" class="label" >左栏 A1…A4 → 右栏 B1…B4</text><text x="531" y="328" class="small" >保留页面坐标、标题、阅读序与置信度</text><text x="518" y="409" class="small" >扫描件还需要 OCR；公式、表格仍应分别处理。</text></svg>