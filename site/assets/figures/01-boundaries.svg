<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title description"><title id="title">RAG 的故障位置</title><desc id="description">对比检索不足、来源冲突和生成误引三类不同的错误。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#568a87"/></marker></defs><rect width="960" height="360" rx="20" fill="#f7faf8"/><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#203035}.small{font-size:15px;fill:#556c70}.title{font-size:22px;font-weight:750}.label{font-size:18px;font-weight:680}.note{font-size:14px;fill:#556c70}</style><text x="33" y="49" class="title">错误可以发生在三个不同关口</text><rect x="44" y="100" width="245" height="111" rx="13" fill="#fff0e7" stroke="#d9a18c" stroke-width="2"/><text x="166.5" y="134" text-anchor="middle" class="label">召回遗漏</text><text x="166.5" y="161" text-anchor="middle" class="small">关键文档根本没找到</text><rect x="356" y="100" width="245" height="111" rx="13" fill="#fff0e7" stroke="#d9a18c" stroke-width="2"/><text x="478.5" y="134" text-anchor="middle" class="label">上下文冲突</text><text x="478.5" y="161" text-anchor="middle" class="small">新版与旧版混在一起</text><rect x="668" y="100" width="245" height="111" rx="13" fill="#fff0e7" stroke="#d9a18c" stroke-width="2"/><text x="790.5" y="134" text-anchor="middle" class="label">生成误引</text><text x="790.5" y="161" text-anchor="middle" class="small">回答与证据不相符</text><path d="M289 156 L349 156" stroke="#568a87" fill="none" stroke-width="3" marker-end="url(#arrow)"/><path d="M601 156 L661 156" stroke="#568a87" fill="none" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="280" class="small">检查 Recall@k</text><text x="355" y="280" class="small">检查版本与权限过滤</text><text x="666" y="280" class="small">检查声明级引用与拒答</text></svg>