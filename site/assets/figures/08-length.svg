<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" role="img" aria-labelledby="t-08-len d-08-len"><title id="t-08-len">b 控制文档长度归一化的强度</title><desc id="d-08-len">BM25 分母中的长度因子随文档长度与平均长度之比上升；b=0 时不变，b=1 时严格线性增长，b=0.75 介于两者之间。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.k{font-size:22px;font-weight:760}.l{font-size:16px;font-weight:700}.s{font-size:14px;fill:#4c686c}</style><rect x="0" y="0" width="1080" height="400" rx="22" fill="#f7faf8"/><text x="38" y="46" class="k">文档越长，分母越大，词频被压得越低</text><line x1="90" y1="320" x2="600" y2="320" stroke="#8ba7a3" stroke-width="1.6"/><line x1="90" y1="320" x2="90" y2="90" stroke="#8ba7a3" stroke-width="1.6"/><text x="235" y="360" class="s">|D| / avgdl（相对长度，0.3–2.5）</text><text x="40" y="210" class="s" transform="rotate(-90 40 210)">长度因子</text><polyline points="90,250 136,250 183,250 229,250 275,250 322,250 368,250 415,250 461,250 507,250 554,250 600,250" fill="none" stroke="#7461ba" stroke-width="2.4"/><polyline points="90,302 136,286 183,270 229,253 275,237 322,221 368,204 415,188 461,172 507,155 554,139 600,123" fill="none" stroke="#147f80" stroke-width="2.8"/><polyline points="90,320 136,298 183,276 229,255 275,233 322,211 368,189 415,167 461,145 507,124 554,102 600,80" fill="none" stroke="#d06d4d" stroke-width="2.4"/><rect x="648" y="112" width="392" height="168" rx="12" fill="#fff" stroke="#ceddd8" stroke-width="1.5"/><text x="668" y="146" class="l">1 − b + b·(|D|/avgdl)</text><line x1="668" y1="176" x2="716" y2="176" stroke="#7461ba" stroke-width="2.6"/><text x="726" y="181" class="s">b=0：不归一化</text><line x1="668" y1="212" x2="716" y2="212" stroke="#147f80" stroke-width="2.6"/><text x="726" y="217" class="s">b=0.75：默认强度</text><line x1="668" y1="248" x2="716" y2="248" stroke="#d06d4d" stroke-width="2.6"/><text x="726" y="253" class="s">b=1：完全线性</text><text x="90" y="388" class="s">曲线按公式绘制，仅展示形状</text></svg>
