<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title description"><title id="title">无检索与有检索的推理路径对比</title><desc id="description">上方只有模型参数，下方有可更新的外部证据，最终答案仍需验证。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#568a87"/></marker></defs><rect width="960" height="360" rx="20" fill="#f7faf8"/><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#203035}.small{font-size:15px;fill:#556c70}.title{font-size:22px;font-weight:750}.label{font-size:18px;font-weight:680}.note{font-size:14px;fill:#556c70}</style><text x="38" y="47" class="title">同一道问题，两条路径</text><text x="39" y="107" class="label">仅使用模型</text><rect x="240" y="73" width="230" height="79" rx="13" fill="#fff0e7" stroke="#d9a18c" stroke-width="2"/><text x="355" y="107" text-anchor="middle" class="label">模型参数</text><text x="355" y="134" text-anchor="middle" class="small">可能过期</text><rect x="612" y="73" width="290" height="79" rx="13" fill="#fff0e7" stroke="#d9a18c" stroke-width="2"/><text x="757" y="107" text-anchor="middle" class="label">生成文本</text><text x="757" y="134" text-anchor="middle" class="small">缺少可追溯依据</text><path d="M475 113 L607 113" stroke="#568a87" fill="none" stroke-width="3" marker-end="url(#arrow)"/><text x="39" y="243" class="label">检索增强</text><rect x="240" y="205" width="174" height="79" rx="13" fill="#e4f3f0" stroke="#70aaa7" stroke-width="2"/><text x="327" y="239" text-anchor="middle" class="label">查询</text><text x="327" y="266" text-anchor="middle" class="small">问题 + 权限</text><rect x="449" y="205" width="203" height="79" rx="13" fill="#e4f3f0" stroke="#70aaa7" stroke-width="2"/><text x="550.5" y="239" text-anchor="middle" class="label">外部片段</text><text x="550.5" y="266" text-anchor="middle" class="small">版本 / 来源</text><rect x="699" y="205" width="203" height="79" rx="13" fill="#efeaf9" stroke="#afa3dc" stroke-width="2"/><text x="800.5" y="239" text-anchor="middle" class="label">有依据的回答</text><text x="800.5" y="266" text-anchor="middle" class="small">仍需核验</text><path d="M414 245 L445 245" stroke="#568a87" fill="none" stroke-width="3" marker-end="url(#arrow)"/><path d="M653 245 L695 245" stroke="#568a87" fill="none" stroke-width="3" marker-end="url(#arrow)"/><text x="242" y="326" class="note">RAG 的价值是引入可检查的证据，不是自动消除幻觉。</text></svg>