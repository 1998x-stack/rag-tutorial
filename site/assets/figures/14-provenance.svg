<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" role="img" aria-labelledby="t14prov d14prov">
<title id="t14prov">从资料片段到带引用回答的引用链，以及生成后的引用校验闸门</title>
<desc id="d14prov">检索到的片段被编号拼入提示，语言模型生成带 [n] 标号的回答，引用校验器检查每个编号是否落在 1 到 N 内：合法则放行给用户，越界则打回。校验器只查编号合法性，不判断内容是否真的被资料支持。</desc>
<style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.k{font-size:22px;font-weight:760}.l{font-size:15px;font-weight:700}.s{font-size:13px;fill:#4c686c}.a{font-size:13px;font-weight:720;fill:#147f80}.o{font-size:13px;font-weight:720;fill:#d06d4d}</style>
<rect x="0" y="0" width="1080" height="420" rx="22" fill="#f7faf8"/>
<text x="38" y="44" class="k">引用是一条从资料到回答的链，且有一道可检查的闸门</text>
<rect x="40" y="130" width="185" height="86" rx="11" fill="#eef7f5" stroke="#147f80" stroke-width="2"/>
<text x="58" y="162" class="l">候选资料</text><text x="58" y="186" class="s">[1][2][3] + 来源元数据</text>
<rect x="275" y="130" width="190" height="86" rx="11" fill="#fff" stroke="#ceddd8" stroke-width="1.5"/>
<text x="293" y="162" class="l">提示拼装</text><text x="293" y="186" class="s">编号 + 边界 + 引用要求</text>
<rect x="515" y="130" width="175" height="86" rx="11" fill="#fff1e8" stroke="#d06d4d" stroke-width="2"/>
<text x="533" y="162" class="l o">语言模型生成</text><text x="533" y="186" class="s">逐句写出标号</text>
<rect x="740" y="130" width="200" height="86" rx="11" fill="#ede9f7" stroke="#7461ba" stroke-width="2"/>
<text x="758" y="162" class="l">带引用的回答</text><text x="758" y="186" class="s">“……[1][2]”</text>
<path d="M225 173 L275 173" fill="none" stroke="#8ba7a3" stroke-width="2" marker-end="url(#a14p)"/>
<path d="M465 173 L515 173" fill="none" stroke="#8ba7a3" stroke-width="2" marker-end="url(#a14p)"/>
<path d="M690 173 L740 173" fill="none" stroke="#8ba7a3" stroke-width="2" marker-end="url(#a14p)"/>
<rect x="300" y="280" width="560" height="86" rx="11" fill="#fff" stroke="#147f80" stroke-width="2" stroke-dasharray="6 4"/>
<text x="320" y="313" class="l">引用校验器：每个 [n] 是否 1 ≤ n ≤ N？</text>
<text x="320" y="340" class="s">是 → 放行给用户；越界/缺失 → 打回重写或标记不确定</text>
<path d="M840 216 L840 250 L700 250 L700 280" fill="none" stroke="#8ba7a3" stroke-width="2" marker-end="url(#a14p)"/>
<text x="40" y="386" class="s">注意：校验器只检查编号的“合法性”，不判断内容是否真被资料支持；后者需要归因核查（下一节）。</text>
<defs><marker id="a14p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#8ba7a3"/></marker></defs>
</svg>
