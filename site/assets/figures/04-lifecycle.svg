<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 451" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">知识库版本更新如何避免旧证据残留</title><desc id="svg-desc">从 v1 发布、v2 更新、权限撤销到索引与缓存失效的完整生命周期。</desc><defs><marker id="ar-147f80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#147f80"/></marker><marker id="ar-d06d4d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#d06d4d"/></marker><marker id="ar-7461ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7461ba"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:22px;font-weight:760}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:#4c686c}.tiny{font-size:14px;fill:#4c686c}.accent{font-size:14px;font-weight:720;fill:#147f80}.warning{font-size:14px;font-weight:680;fill:#ac583a}.white{fill:white;font-size:15px;font-weight:700}.num{font-size:19px;font-weight:750;fill:#20494a}</style><rect x="0" y="0" width="1080" height="451" rx="22" fill="#f7faf8"/><text x="38" y="50" class="title" >更新不仅是追加新向量，还必须让旧证据不可见</text><rect x="38" y="105" width="223" height="93" fill="#ede9f7" stroke="#aaa1d3" stroke-width="1.5" rx="13"/><text x="54" y="136" class="label" >v1 · 旧条款</text><text x="54" y="161" class="small" >index_rev=17</text><rect x="310" y="105" width="223" height="93" fill="#e9f5f2" stroke="#7bb9ad" stroke-width="1.5" rx="13"/><text x="326" y="136" class="label" >v2 · 新条款</text><text x="326" y="161" class="small" >index_rev=18</text><rect x="584" y="105" width="213" height="93" fill="#fff0e7" stroke="#dca08a" stroke-width="1.5" rx="13"/><text x="600" y="136" class="label" >撤销 / 删除</text><text x="600" y="161" class="small" >tombstone / ACL</text><rect x="846" y="105" width="194" height="93" fill="#e9f5f2" stroke="#7bb9ad" stroke-width="1.5" rx="13"/><text x="862" y="136" class="label" >可见性屏障</text><text x="862" y="161" class="small" >查询过滤 + 缓存清除</text><path d="M262,151 L305,151" fill="none" stroke="#147f80" stroke-width="2.6"  marker-end="url(#ar-147f80)"/><path d="M533,151 L579,151" fill="none" stroke="#147f80" stroke-width="2.6"  marker-end="url(#ar-147f80)"/><path d="M798,151 L841,151" fill="none" stroke="#147f80" stroke-width="2.6"  marker-end="url(#ar-147f80)"/><rect x="38" y="258" width="995" height="136" fill="#fff" stroke="#d5e4df" stroke-width="1.5" rx="12"/><text x="62" y="293" class="label" >安全更新的几个必须条件</text><text x="62" y="330" class="small" >① 幂等重试 / 版本比对     ② 旧索引与缓存失效     ③ 权限撤销即时可见</text><text x="62" y="361" class="small" >④ 来源指针仍能定位正确版本     ⑤ 更新失败可回滚或拒答</text><text x="39" y="433" class="tiny" >示意协议：不同检索服务的原子切换、删除一致性和缓存能力需要实测。</text></svg>