<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" role="img" aria-labelledby="t-07-ann d-07-ann"><title id="t-07-ann">暴力检索与 ANN 检索访问的数据量</title><desc id="d-07-ann">左侧暴力检索访问全部 n 个向量并精确排序；右侧 ANN 索引只访问少量候选再排序，可能漏掉部分真实近邻。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.k{font-size:22px;font-weight:760}.l{font-size:17px;font-weight:700}.s{font-size:15px;fill:#4c686c}.w{fill:#fff;font-size:15px;font-weight:700}</style><rect x="0" y="0" width="1080" height="360" rx="22" fill="#f7faf8"/><text x="38" y="48" class="k">访问多少向量，决定延迟；排序只在候选内进行</text><rect x="38" y="86" width="480" height="235" rx="14" fill="#fff" stroke="#ceddd8" stroke-width="1.5"/><text x="60" y="120" class="l">暴力 flat 检索</text><text x="60" y="148" class="s">访问全部 n 个向量</text><rect x="60" y="170" width="436" height="52" rx="9" fill="#eef7f5" stroke="#7db6a9"/><text x="78" y="202" class="l">扫描 1…n</text><rect x="60" y="242" width="436" height="52" rx="9" fill="#e2f1ee" stroke="#7db6a9"/><text x="78" y="274" class="l">精确 top-k</text><rect x="562" y="86" width="480" height="235" rx="14" fill="#fff" stroke="#ceddd8" stroke-width="1.5"/><text x="584" y="120" class="l">ANN 索引检索</text><text x="584" y="148" class="s">只访问少量候选</text><rect x="584" y="170" width="436" height="52" rx="9" fill="#ede9f7" stroke="#aaa1d3"/><text x="602" y="202" class="l">访问候选子集</text><rect x="584" y="242" width="436" height="52" rx="9" fill="#e2f1ee" stroke="#7db6a9"/><text x="602" y="274" class="l">近似 top-k，可能漏近邻</text></svg>
