<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title description"><title id="title">从知识到有依据的答案</title><desc id="description">文档经过解析和索引，用户问题经过检索、筛选、生成，答案包含来源。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#568a87"/></marker></defs><rect width="960" height="360" rx="20" fill="#f7faf8"/><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#203035}.small{font-size:15px;fill:#556c70}.title{font-size:22px;font-weight:750}.label{font-size:18px;font-weight:680}.note{font-size:14px;fill:#556c70}</style><text x="40" y="55" class="title">让生成变得可核查</text><rect x="40" y="112" width="162" height="94" rx="13" fill="#e4f3f0" stroke="#70aaa7" stroke-width="2"/><text x="121" y="146" text-anchor="middle" class="label">知识文档</text><text x="121" y="173" text-anchor="middle" class="small">持续更新</text><rect x="250" y="112" width="162" height="94" rx="13" fill="#e4f3f0" stroke="#70aaa7" stroke-width="2"/><text x="331" y="146" text-anchor="middle" class="label">构建索引</text><text x="331" y="173" text-anchor="middle" class="small">切块 / 编码</text><rect x="460" y="112" width="162" height="94" rx="13" fill="#e4f3f0" stroke="#70aaa7" stroke-width="2"/><text x="541" y="146" text-anchor="middle" class="label">检索证据</text><text x="541" y="173" text-anchor="middle" class="small">稀疏 + 稠密</text><rect x="670" y="112" width="234" height="94" rx="13" fill="#f9e9e2" stroke="#d98c73" stroke-width="2"/><text x="787" y="146" text-anchor="middle" class="label">生成回答</text><text x="787" y="173" text-anchor="middle" class="small">引用 / 允许拒答</text><path d="M202 159 L247 159" stroke="#568a87" fill="none" stroke-width="3" marker-end="url(#arrow)"/><path d="M412 159 L457 159" stroke="#568a87" fill="none" stroke-width="3" marker-end="url(#arrow)"/><path d="M622 159 L667 159" stroke="#568a87" fill="none" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="277" class="small">用户问题 ↗ 在检索时提供查询条件；模型参数不等于可审计的证据库。</text><path d="M510 290 L510 221" stroke="#7461ba" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="525" y="306" class="note">问题进入在线路径</text></svg>