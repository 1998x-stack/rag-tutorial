<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 452" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">分块边界如何损坏事实</title><desc id="svg-desc">固定字符切割将退款期限拆开，而结构切割把完整句子和适用范围保留。 </desc><defs><marker id="ar-147f80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#147f80"/></marker><marker id="ar-d06d4d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#d06d4d"/></marker><marker id="ar-7461ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7461ba"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:22px;font-weight:760}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:#4c686c}.tiny{font-size:14px;fill:#4c686c}.accent{font-size:14px;font-weight:720;fill:#147f80}.warning{font-size:14px;font-weight:680;fill:#ac583a}.white{fill:white;font-size:15px;font-weight:700}.num{font-size:19px;font-weight:750;fill:#20494a}</style><rect x="0" y="0" width="1080" height="452" rx="22" fill="#f7faf8"/><text x="36" y="48" class="title" >一个边界，可能让事实的条件与结论分家</text><text x="38" y="89" class="accent" >原文事实</text><rect x="38" y="107" width="1004" height="54" fill="#eef5f2" stroke="#a2ccc2" stroke-width="1.5" rx="7"/><text x="540" y="140" class="small" text-anchor="middle">2026 版退款政策：购买后 7 天内可申请退款，且须出示购买凭证。</text><text x="38" y="210" class="warning" >固定切割（示意，非 token 数）</text><rect x="38" y="229" width="482" height="65" fill="#fff0e7" stroke="#dc9a80" stroke-width="1.5" rx="7"/><text x="279" y="267.5" class="small" text-anchor="middle">Chunk A：2026版…购买后</text><rect x="552" y="229" width="490" height="65" fill="#fff0e7" stroke="#dc9a80" stroke-width="1.5" rx="7"/><text x="797" y="267.5" class="small" text-anchor="middle">Chunk B：7天内…购买凭证</text><text x="525" y="276" class="warning" >│</text><text x="38" y="351" class="accent" >按句/条款边界保留完整语义</text><rect x="38" y="367" width="1004" height="58" fill="#dcefeb" stroke="#8abab0" stroke-width="1.5" rx="7"/><text x="540" y="402" class="small" text-anchor="middle">Chunk：2026版退款政策 + 7天期限 + 购买凭证条件</text></svg>