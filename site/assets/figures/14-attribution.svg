<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" role="img" aria-labelledby="t14attr d14attr">
<title id="t14attr">把带引用的回答拆成声明，逐条对被引用资料做归因核查</title>
<desc id="d14attr">回答被拆成三条原子声明，每条声明拿它引用的那段资料做 NLI 判断：前两条被资料蕴含所以支持，第三条数字未在资料中出现，判为不支持并标记。归因核查与编号校验是两个不同粒度。</desc>
<style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.k{font-size:22px;font-weight:760}.l{font-size:14.5px;font-weight:700}.s{font-size:13px;fill:#4c686c}.a{font-size:13px;font-weight:720;fill:#147f80}.o{font-size:13px;font-weight:720;fill:#b8532f}</style>
<rect x="0" y="0" width="1080" height="440" rx="22" fill="#f7faf8"/>
<text x="38" y="44" class="k">把回答拆成声明，逐条拿“被引用的资料”做归因核查</text>
<text x="40" y="82" class="s">回答 → 原子声明 → NLI(声明, 资料[k]) → 支持 / 标记</text>
<g><rect x="40" y="100" width="340" height="66" rx="10" fill="#fff" stroke="#ceddd8" stroke-width="1.5"/><text x="58" y="132" class="l">声明 1：“可并行计算”</text><text x="58" y="154" class="s">引用 [1]</text><rect x="420" y="100" width="240" height="66" rx="10" fill="#eef7f5" stroke="#147f80" stroke-width="1.6"/><text x="438" y="132" class="l">NLI(声明, 资料[1])</text><text x="438" y="154" class="s">→ 蕴含</text><rect x="710" y="100" width="330" height="66" rx="10" fill="#eef7f5" stroke="#147f80" stroke-width="1.6"/><text x="728" y="132" class="l a">支持</text><text x="728" y="154" class="s">资料直接支持该说法</text><path d="M380 133 L420 133" fill="none" stroke="#8ba7a3" stroke-width="2" marker-end="url(#a14v)"/><path d="M660 133 L710 133" fill="none" stroke="#8ba7a3" stroke-width="2" marker-end="url(#a14v)"/></g>
<g><rect x="40" y="186" width="340" height="66" rx="10" fill="#fff" stroke="#ceddd8" stroke-width="1.5"/><text x="58" y="218" class="l">声明 2：“位置编码提供顺序”</text><text x="58" y="240" class="s">引用 [2]</text><rect x="420" y="186" width="240" height="66" rx="10" fill="#eef7f5" stroke="#147f80" stroke-width="1.6"/><text x="438" y="218" class="l">NLI(声明, 资料[2])</text><text x="438" y="240" class="s">→ 蕴含</text><rect x="710" y="186" width="330" height="66" rx="10" fill="#eef7f5" stroke="#147f80" stroke-width="1.6"/><text x="728" y="218" class="l a">支持</text><text x="728" y="240" class="s">资料直接支持该说法</text><path d="M380 219 L420 219" fill="none" stroke="#8ba7a3" stroke-width="2" marker-end="url(#a14v)"/><path d="M660 219 L710 219" fill="none" stroke="#8ba7a3" stroke-width="2" marker-end="url(#a14v)"/></g>
<g><rect x="40" y="272" width="340" height="66" rx="10" fill="#fff" stroke="#ceddd8" stroke-width="1.5"/><text x="58" y="304" class="l">声明 3：“比 RNN 快 5 倍”</text><text x="58" y="326" class="s">引用 [2]</text><rect x="420" y="272" width="240" height="66" rx="10" fill="#fff1e8" stroke="#d06d4d" stroke-width="1.6"/><text x="438" y="304" class="l">NLI(声明, 资料[2])</text><text x="438" y="326" class="s">→ 中立 / 矛盾</text><rect x="710" y="272" width="330" height="66" rx="10" fill="#fff1e8" stroke="#d06d4d" stroke-width="1.6"/><text x="728" y="304" class="l o">标记：未被资料支持</text><text x="728" y="326" class="s">数字不在资料中，不展示为结论</text><path d="M380 305 L420 305" fill="none" stroke="#8ba7a3" stroke-width="2" marker-end="url(#a14v)"/><path d="M660 305 L710 305" fill="none" stroke="#8ba7a3" stroke-width="2" marker-end="url(#a14v)"/></g>
<text x="40" y="382" class="s">说明：编号校验只查 [n] 是否越界（句法级）；归因核查才判断内容是否真被资料支持（语义级）。</text>
<text x="40" y="410" class="s">图中声明与判定为教学示例，用来说明核查流程，不是某个系统的实测结果。</text>
<defs><marker id="a14v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#8ba7a3"/></marker></defs>
</svg>
